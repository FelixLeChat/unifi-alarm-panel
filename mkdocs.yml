site_name: UniFi Alarm Panel
site_description: A self-hosted alarm panel for UniFi Protect, with a PIN keypad on a wall tablet, entry and exit delays, per-person PINs and alerts to Slack, ntfy, Telegram and Signal.
site_url: https://felixlechat.github.io/unifi-alarm-panel/
repo_url: https://github.com/FelixLeChat/unifi-alarm-panel
repo_name: FelixLeChat/unifi-alarm-panel
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }

nav:
  - Home: index.md
  - Get started:
      - Install: INSTALL.md
      - Configuration: CONFIGURATION.md
      - UniFi integration: UNIFI.md
      - Signal alerts: SIGNAL.md
  - Run it:
      - Operations: OPERATIONS.md
      - Runbook: RUNBOOK.md
  - Contribute:
      - Development: DEVELOPMENT.md
      - Design system: design.md
