name: Docs

# Builds the MkDocs site from docs/ on every change (strict, so a broken link fails the PR)
# and, on main, publishes it to GitHub Pages: https://felixlechat.github.io/unifi-alarm-panel/
# To publish: enable Pages once (Settings > Pages > Source: GitHub Actions; a private repo needs a paid
# plan), then add the repository variable PAGES_ENABLED=true (Settings > Secrets and variables > Actions >
# Variables). Until then only the build runs, so main isn't red for a Pages deploy that can't succeed.
on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "requirements-docs.txt", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "requirements-docs.txt", ".github/workflows/docs.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
