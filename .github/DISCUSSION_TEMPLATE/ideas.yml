body:
  - type: markdown
    attributes:
      value: |
        Every feature is something to test, secure and maintain, so a short discussion first saves a rejected pull request. Read [AI_POLICY.md](https://github.com/FelixLeChat/unifi-alarm-panel/blob/main/AI_POLICY.md) before posting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today. A concrete situation beats a general wish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Options are welcome.
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Does it need new hardware, a new outbound call, or a UniFi behavior not confirmed on a real console?
