name: Bug report
description: Something behaves wrong, or an alert fired or didn't fire when it should have
labels: [bug]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Checked first
      options:
        - label: I searched the existing issues, open and closed, and this isn't a duplicate.
          required: true
        - label: I read [docs/RUNBOOK.md](https://github.com/FelixLeChat/unifi-alarm-panel/blob/main/docs/RUNBOOK.md) and it doesn't cover this.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Panel (kiosk)
        - Admin UI
        - Alerts (Slack / ntfy / Telegram / Signal)
        - Sensors / UniFi intake
        - Camera streaming (go2rtc)
        - Deploy / update
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Arm from the panel
        2. Open the back door
        3. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: From `GET /api/health`, or the admin footer.
      placeholder: v1.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it is installed
      options:
        - Docker Compose
        - systemd (bare box or LXC)
        - Proxmox script
        - Other
    validations:
      required: true
  - type: input
    id: unifi
    attributes:
      label: UniFi console and Protect version
      placeholder: UDM Pro, Protect 7.0.x
  - type: textarea
    id: logs
    attributes:
      label: Logs and audit events
      description: "`sudo journalctl -u unifi-alarm-panel`, the `/api/health` output, or the audit log rows around the time. Remove secrets and PINs."
      render: shell
