version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint supports TypeScript <6.1 only, and eslint-plugin-react
      # (via eslint-config-next) breaks on ESLint 10. Drop these once upstream catches up.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
